# ==========================
# WRK CONFIGURATION
# ==========================

THREADS=16
# Numero connessioni simultanee
CONNECTIONS=100
# Durata singolo test
DURATION="5m"
# Timeout per singola richiesta (default di wrk: 2s)
WRK_TIMEOUT="15s"
# Numero ripetizioni
RUNS=3
# Tempo tra due run
COOLDOWN=120

# ==========================
# K6 / CICLO APERTO
# ==========================
# MAX_VUS = rate_max * timeout * 1.2

# Rate di richieste al secondo da testare (separati da spazio)
# considerare percentuali della capacitÃ del sistema (circa 93 req/s): 50%, 100%, 150%
RATES="50 100 125"
# Warm-up prima di ogni run
WARMUP_RATE=20
WARMUP_DURATION="60s"

K6_IMAGE="grafana/k6:latest"   # meglio una versione fissa, es. grafana/k6:1.x.y
PRE_VUS=300                    # VU preparate in anticipo
MAX_VUS=2000                   # tetto di richieste contemporaneamente in volo

# ==========================
# TEST NAME for OUTPUT DIR BASE
# ==========================

# TEST="offloading_stateless/single_stateless"
# TEST="baseline/capacity_test"
TEST="baseline/workload_test"


# ==========================
# OFFLOADING
# ==========================

DEPLOYMENT="currencyservice"

# ==========================
# KUBERNETES
# ==========================

NAMESPACE="shop"
MONITORING_NAMESPACE="monitoring"
WRK_POD="wrk-tester"
K6_POD="k6-tester"

# ==========================
# TARGET WRK
# ==========================

TARGET_URL="http://frontend-external:80"

# ==========================
# PROMETHEUS
# ==========================
PROMETHEUS_SERVICE="monitoring-kube-prometheus-prometheus"
PROMETHEUS_PORT=9090
