# ==========================
# WRK CONFIGURATION
# ==========================

THREADS=16
# Numero connessioni simultanee
CONNECTIONS=1000
# Durata singolo test
DURATION="5m"
# Timeout per singola richiesta (default di wrk: 2s)
WRK_TIMEOUT="30s"
# Numero ripetizioni
RUNS=3
# Tempo tra due run
COOLDOWN=120

# ==========================
# TEST NAME for OUTPUT DIR BASE
# ==========================

# TEST="offloading_stateless/single_stateless"
TEST="baseline"

# ==========================
# OFFLOADING
# ==========================

DEPLOYMENT="currencyservice"

# ==========================
# KUBERNETES
# ==========================

NAMESPACE="shop"
MONITORING_NAMESPACE="monitoring"
WRK_POD="wrk-tester"

# ==========================
# TARGET WRK
# ==========================

TARGET_URL="http://frontend-external:80"

# ==========================
# PROMETHEUS
# ==========================
PROMETHEUS_SERVICE="monitoring-kube-prometheus-prometheus"
PROMETHEUS_PORT=9090

